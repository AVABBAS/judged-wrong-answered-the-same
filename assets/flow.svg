  <text x="188" y="70" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Iterative self-review</text>
  <text x="188" y="98" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#cfdde9">Models judge their own answers</text>
